# Inventario de referencia del laboratorio.
#
# Vagrant usa el provisioner "ansible_local": cada VM ejecuta su propio
# playbook contra si misma (localhost), por lo que este inventario NO es
# necesario para "vagrant up". Se deja documentado para quien quiera
# ejecutar los playbooks a mano desde el host, vía SSH, por ejemplo:
#
#   ansible-playbook -i ansible/inventory.ini ansible/server.yml \
#     --private-key <(vagrant ssh-config server | grep IdentityFile | awk '{print $2}')
#
# o simplemente entrando con "vagrant ssh <vm>" y corriendo el playbook local:
#
#   vagrant ssh server -c "ansible-playbook /vagrant/ansible/server.yml --connection=local -i localhost,"

[server]
192.168.56.20 ansible_user=vagrant

[client]
192.168.56.10 ansible_user=vagrant

[kali]
192.168.56.30 ansible_user=vagrant

[victims:children]
server
client
