---
# Playbook KALI
# Instala herramientas nativas de ataque (sin Docker: necesitan acceso
# crudo a la interfaz de red) y prepara la VM para actuar como
# man-in-the-middle entre client (192.168.56.10) y server (192.168.56.20).

- hosts: all
  become: true

  tasks:
    - name: Actualizar cache de apt
      apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Instalar herramientas de ataque
      apt:
        name:
          - dsniff # arpspoof
          - wireshark
          - tshark
          - mitmproxy
          - tcpdump
          - net-tools
          - iptables
          - curl
        state: present

    - name: Permitir captura de paquetes sin sudo (grupo wireshark)
      user:
        name: vagrant
        groups: wireshark
        append: true

    - name: Habilitar reenvio de paquetes IPv4 (necesario para el MITM)
      sysctl:
        name: net.ipv4.ip_forward
        value: "1"
        state: present
        sysctl_set: true
        reload: true

    - name: Dar permiso de ejecucion al script de ataque
      file:
        path: /vagrant/scripts/start-attack.sh
        mode: "0755"

    - name: Crear carpeta de capturas
      file:
        path: /home/vagrant/captures
        state: directory
        owner: vagrant
        group: vagrant
        mode: "0755"

    # -----------------------------------------------------------------
    # Escritorio grafico: la caja "kalilinux/rolling" de Vagrant es la
    # imagen minima (sin XFCE), asi que se instala aparte para poder
    # correr start-attack.sh y abrir Wireshark/mitmproxy con interfaz
    # grafica desde la ventana de VirtualBox (vb.gui = true), sin SSH.
    # -----------------------------------------------------------------
    - name: Instalar escritorio XFCE minimo
      apt:
        name:
          - xfce4
          - xfce4-terminal
          - lightdm
        state: present

    - name: Configurar autologin de vagrant en lightdm (sesion XFCE)
      copy:
        dest: /etc/lightdm/lightdm.conf.d/50-autologin.conf
        mode: "0644"
        content: |
          [Seat:*]
          autologin-user=vagrant
          autologin-user-timeout=0
          user-session=xfce

    - name: Arrancar en modo grafico por defecto
      command: systemctl set-default graphical.target
      changed_when: true

    - name: Asegurar que lightdm esta habilitado
      service:
        name: lightdm
        enabled: true
