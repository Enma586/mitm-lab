---
# Playbook CLIENT
# Instala Docker, copia client/ (frontend "victima") y lo levanta expuesto
# en el puerto 80 por HTTP plano. Esta es la maquina que la victima usa
# para navegar la app; todo su trafico hacia el server viaja sin cifrar.

- hosts: all
  become: true

  vars:
    app_src: /vagrant/client
    app_dir: /opt/mitm-client
    app_image: mitm-client:latest
    app_container: mitm-client
    app_port: 80

  tasks:
    - name: Actualizar cache de apt
      apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Instalar dependencias base
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - rsync
        state: present

    - name: Crear directorio para la llave de Docker
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Agregar llave GPG oficial de Docker
      get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Agregar repositorio de Docker
      apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present
        filename: docker

    - name: Instalar Docker Engine y el plugin de compose
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Asegurar que Docker esta corriendo
      service:
        name: docker
        state: started
        enabled: true

    - name: Agregar el usuario vagrant al grupo docker
      user:
        name: vagrant
        groups: docker
        append: true

    - name: Copiar el codigo fuente del frontend a la VM
      command: >
        rsync -a --delete
        --exclude=node_modules --exclude=dist
        {{ app_src }}/ {{ app_dir }}/
      changed_when: true

    - name: Construir la imagen Docker del frontend
      command: docker build -t {{ app_image }} {{ app_dir }}
      changed_when: true

    - name: Quitar contenedor previo si existe (para poder re-provisionar)
      command: docker rm -f {{ app_container }}
      failed_when: false
      changed_when: true

    - name: Levantar el contenedor del frontend
      command: >
        docker run -d
        --name {{ app_container }}
        --restart unless-stopped
        -p 0.0.0.0:{{ app_port }}:80
        {{ app_image }}
      changed_when: true
