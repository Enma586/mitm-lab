---
# Playbook CLIENT
# Instala Docker, copia client/ (frontend "victima") y lo levanta expuesto
# en el puerto 80 por HTTP plano. Esta es la maquina que la victima usa
# para navegar la app; todo su trafico hacia el server viaja sin cifrar.

- hosts: all
  become: true

  vars:
    app_src: /vagrant/client
    app_dir: /opt/mitm-client
    app_image: mitm-client:latest
    app_container: mitm-client
    app_port: 80

  tasks:
    - name: Actualizar cache de apt
      apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Instalar dependencias base
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - rsync
        state: present

    - name: Crear directorio para la llave de Docker
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Agregar llave GPG oficial de Docker
      get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Agregar repositorio de Docker
      apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present
        filename: docker

    - name: Instalar Docker Engine y el plugin de compose
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Asegurar que Docker esta corriendo
      service:
        name: docker
        state: started
        enabled: true

    - name: Agregar el usuario vagrant al grupo docker
      user:
        name: vagrant
        groups: docker
        append: true

    - name: Copiar el codigo fuente del frontend a la VM
      command: >
        rsync -a --delete
        --exclude=node_modules --exclude=dist
        {{ app_src }}/ {{ app_dir }}/
      changed_when: true

    - name: Construir la imagen Docker del frontend
      command: docker build -t {{ app_image }} {{ app_dir }}
      changed_when: true

    - name: Quitar contenedor previo si existe (para poder re-provisionar)
      command: docker rm -f {{ app_container }}
      failed_when: false
      changed_when: true

    - name: Levantar el contenedor del frontend
      command: >
        docker run -d
        --name {{ app_container }}
        --restart unless-stopped
        -p 0.0.0.0:{{ app_port }}:80
        {{ app_image }}
      changed_when: true

    # -----------------------------------------------------------------
    # Fase 7.1 del roadmap: escritorio minimo + Firefox para que la
    # "victima" navegue la app de verdad (tráfico 100% real) desde la
    # ventana de VirtualBox (vb.gui = true en el Vagrantfile), en vez de
    # simular el login con curl.
    # -----------------------------------------------------------------
    - name: Instalar escritorio XFCE completo
      # El metapaquete "xfce4" (no solo xfce4-session) trae xfwm4 (window
      # manager), xfce4-panel y xfdesktop4: sin ellos X arranca pero se ve
      # una pantalla gris vacia, sin panel ni fondo de escritorio.
      apt:
        name:
          - xfce4
          - xfce4-terminal
          - lightdm
          - snapd
        state: present

    - name: Esperar a que snapd termine de inicializar
      command: snap wait system seed.loaded
      changed_when: false

    - name: Instalar Firefox (snap; Ubuntu 22.04 no trae firefox por apt)
      command: snap install firefox
      args:
        creates: /snap/bin/firefox

    - name: Configurar autologin de vagrant en lightdm (sesion XFCE)
      copy:
        dest: /etc/lightdm/lightdm.conf.d/50-autologin.conf
        mode: "0644"
        content: |
          [Seat:*]
          autologin-user=vagrant
          autologin-user-timeout=0
          user-session=xfce

    - name: Arrancar en modo grafico por defecto
      command: systemctl set-default graphical.target
      changed_when: true

    - name: Fijar lightdm como gestor de login por defecto
      # Si gdm3 quedo registrado como default-display-manager, el
      # ExecStartPre de lightdm.service falla (status=1) y XFCE nunca
      # arranca: la VM se queda solo con la consola de texto.
      copy:
        dest: /etc/X11/default-display-manager
        content: "/usr/sbin/lightdm\n"
        mode: "0644"

    - name: Apuntar display-manager.service a lightdm
      file:
        src: /lib/systemd/system/lightdm.service
        dest: /etc/systemd/system/display-manager.service
        state: link
        force: true

    - name: Asegurar que lightdm esta habilitado y corriendo
      systemd:
        name: lightdm
        enabled: true
        state: started
        daemon_reload: true
